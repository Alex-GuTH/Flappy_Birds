name: Deploy Pygame Web to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install pygbag

      - name: Install project dependencies
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: pip install -r requirements.txt

      - name: Download CJK font for web build
        shell: bash
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/NotoSansCJKsc-Regular.otf ]; then
            curl -L -o assets/fonts/NotoSansCJKsc-Regular.otf \
              https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          fi

      - name: Build web version
        run: python -m pygbag --build main.py

      - name: Show build tree
        shell: bash
        run: |
          echo "Build directory snapshot:"
          find build -maxdepth 4 -type f | head -n 200

      - name: Resolve output directory
        shell: bash
        run: |
          if [ -d "build/web" ]; then
            echo "WEB_DIR=build/web" >> "$GITHUB_ENV"
          elif [ -d "build" ]; then
            INDEX_PATH=$(find build -name "index.html" | head -n 1)
            if [ -z "$INDEX_PATH" ]; then
              echo "No index.html found under build output"
              exit 1
            fi
            echo "WEB_DIR=$(dirname "$INDEX_PATH")" >> "$GITHUB_ENV"
          else
            echo "Build output directory not found"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
